<div class="auth-container">
  <app-custom-card title="Bem-vindo" subtitle="Crie sua conta">
    <form [formGroup]="criarContaForm" (ngSubmit)="onSubmit()">
      <app-custom-input
        name="nome"
        label="Nome"
        placeholder="Digite seu nome"
        formControlName="nome"
        [form]="criarContaForm"
        [required]="true"
        [minLength]="nomeMinLength"
        [maxLength]="nomeMaxLength"
      ></app-custom-input>
      <div class="form-group">
        <app-custom-input
          name="email"
          label="Email"
          placeholder="Digite seu email"
          formControlName="email"
          type="email"
          [form]="criarContaForm"
          [minLength]="emailMinLength"
          [maxLength]="emailMaxLength"
          [required]="true"
        ></app-custom-input>
        <app-custom-input
          name="repitaEmail"
          label="Repetir email"
          placeholder="Digite seu email novamente"
          formControlName="repitaEmail"
          type="email"
          [form]="criarContaForm"
          [maxLength]="emailMaxLength"
          [minLength]="emailMinLength"
          [required]="true"
        ></app-custom-input>
      </div>
      <div class="form-group">
        <app-custom-input
          name="senha"
          label="Senha"
          placeholder="Digite sua senha"
          formControlName="senha"
          type="password"
          [form]="criarContaForm"
          [required]="true"
          [type]="ocultarSenha() ? 'password' : 'text'"
          [required]="true"
          [minLength]="senhaMinLength"
          [maxLength]="senhaMaxLength"
          [endIcon]="ocultarSenha() ? 'visibility_off' : 'visibility'"
          (endIconAction)="clickEventSenha($event)"
        ></app-custom-input>
        <app-custom-input
          name="repitaSenha"
          label="Repetir senha"
          placeholder="Digite sua senha novamente"
          formControlName="repitaSenha"
          type="password"
          [form]="criarContaForm"
          [type]="ocultarRepetirSenha() ? 'password' : 'text'"
          [required]="true"
          [minLength]="senhaMinLength"
          [maxLength]="senhaMaxLength"
          [endIcon]="ocultarRepetirSenha() ? 'visibility_off' : 'visibility'"
          (endIconAction)="clickEventRepetirSenha($event)"
        ></app-custom-input>
      </div>
      <app-custom-button
        [loading]="loading()"
        labelLoading="Criando conta..."
        labelNotLoading="Criar conta"
      ></app-custom-button>

      <div class="auth-link">Já tem conta? <a routerLink="/login">Faça login aqui</a></div>
    </form>
  </app-custom-card>
</div>
