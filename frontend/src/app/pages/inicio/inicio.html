<section class="box-page">
  <div style="display: flex; flex-direction: column">
    <h1>Início</h1>
    <p>Bem-vindo à área interna do sistema.</p>
  </div>
  <img class="img-inicio-calendario" src="img/img-inicio-calendario.png" alt="Logo" />
</section>
<div class="box-reservas">

  </div>
</div>
